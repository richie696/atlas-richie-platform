databaseChangeLog:
  - changeSet:
      id: add-mfa-user-secret-reference
      author: richie-platform
      changes:
        - addColumn:
            tableName: mfa_user_info
            columns:
              - column:
                  name: secret_reference
                  type: TEXT
                  constraints:
                    nullable: true
                  remarks: "旧 KMS/Vault 逻辑引用或 arse:v1 信封密文；不得保存明文 TOTP Secret"
        - createIndex:
            tableName: mfa_user_info
            indexName: mfa_idx_user_info_secret_reference
            columns:
              - column:
                  name: secret_reference
