databaseChangeLog:
  - changeSet:
      id: normalize-mfa-boolean-columns-postgresql
      author: richie-platform
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: postgresql
      changes:
        - sql:
            sql: ALTER TABLE mfa_user_info ALTER COLUMN deleted DROP DEFAULT
        - sql:
            sql: ALTER TABLE mfa_trusted_device ALTER COLUMN deleted DROP DEFAULT
        - sql:
            sql: >-
              ALTER TABLE mfa_user_info
              ALTER COLUMN deleted TYPE BOOLEAN
              USING (CASE WHEN deleted::text IN ('1', 'true', 't') THEN TRUE ELSE FALSE END)
        - sql:
            sql: >-
              ALTER TABLE mfa_trusted_device
              ALTER COLUMN deleted TYPE BOOLEAN
              USING (CASE WHEN COALESCE(deleted::text, '0') IN ('1', 'true', 't') THEN TRUE ELSE FALSE END)
        - sql:
            sql: ALTER TABLE mfa_user_info ALTER COLUMN deleted SET DEFAULT FALSE
        - sql:
            sql: ALTER TABLE mfa_trusted_device ALTER COLUMN deleted SET DEFAULT FALSE
        - sql:
            sql: UPDATE mfa_trusted_device SET deleted = FALSE WHERE deleted IS NULL
        - sql:
            sql: ALTER TABLE mfa_trusted_device ALTER COLUMN deleted SET NOT NULL
