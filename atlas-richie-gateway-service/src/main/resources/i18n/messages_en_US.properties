error.auth.token.invalid.meaning=Invalid token
error.auth.token.invalid.cause=JWT signature verification failed, the format is invalid, or the token has been removed from the blacklist by an administrator
error.auth.token.invalid.investigate=Check the Authorization request header format, verify that the signing key matches, and ensure the client has not been locally modified
error.auth.token.invalid.retry=No
error.auth.token.missing.meaning=Missing token
error.auth.token.missing.cause=The request does not carry the Authorization header or the header format is wrong
error.auth.token.missing.investigate=Make sure the client carries the Bearer token correctly in the request header
error.auth.token.missing.retry=No
error.auth.token.expired.meaning=Token expired
error.auth.token.expired.cause=The JWT exp claim has passed its validity period or has been added to the action blacklist
error.auth.token.expired.investigate=Check the token expiration time, decide whether to log in again or use refresh_token to renew
error.auth.token.expired.retry=No
error.auth.permission.denied.meaning=Insufficient permissions
error.auth.permission.denied.cause=The user is not authorized to access the target endpoint or resource
error.auth.permission.denied.investigate=Check the user role/permission configuration and the access control list to confirm the endpoint is included
error.auth.permission.denied.retry=No
error.tenant.missing.meaning=Missing tenant identifier
error.tenant.missing.cause=The request does not carry X-RD-Tenant-Code or the token does not contain tenantId
error.tenant.missing.investigate=Check whether the client passes the tenant code in the request header and whether the token carries the tenantId claim
error.tenant.missing.retry=No
error.tenant.invalid.meaning=Invalid tenant information
error.tenant.invalid.cause=The tenant has expired, been disabled, or is in an abnormal status
error.tenant.invalid.investigate=Check the tenant status and expiration date, and contact the tenant administrator to confirm the status
error.tenant.invalid.retry=No
error.rate.limited.meaning=Too many requests
error.rate.limited.cause=A Sentinel/QPS rate limit rule was triggered; the client request exceeded the threshold
error.rate.limited.investigate=Check the client request frequency and the threshold configuration, and consider increasing the retry interval
error.rate.limited.retry=Yes
error.upstream.unavailable.meaning=Upstream service unavailable
error.upstream.unavailable.cause=The upstream microservice connection failed or returned a 5xx response
error.upstream.unavailable.investigate=Check whether the upstream service is online, review the downstream instance logs, and verify that service discovery is working
error.upstream.unavailable.retry=Yes
error.upstream.timeout.meaning=Upstream service response timeout
error.upstream.timeout.cause=The upstream service did not respond within the timeout threshold
error.upstream.timeout.investigate=Check the upstream service response time, the downstream timeout configuration, and whether the upstream endpoint needs to be optimized
error.upstream.timeout.retry=Yes
error.system.internal.meaning=Internal system error
error.system.internal.cause=An uncaught, unclassified exception in the gateway (null pointer, unavailable resource, etc.); the specific exception class has been mapped to this code
error.system.internal.investigate=Check the error ID in the gateway logs and contact operations to inspect the downstream service status
error.system.internal.retry=No
error.route.not.found.meaning=Route not found
error.route.not.found.cause=Spring Cloud Gateway did not match any downstream route
error.route.not.found.investigate=Check that the request path is correct, that the route table contains this URL, and that the path matching rules are in effect
error.route.not.found.retry=No
error.req.bad.request.meaning=Bad request parameters
error.req.bad.request.cause=Request body deserialization failed, field validation did not pass, or request parameters are out of the allowed range
error.req.bad.request.investigate=Check the request body JSON format, verify the field names and types, and refer to the parameter constraints in the API documentation
error.req.bad.request.retry=No
