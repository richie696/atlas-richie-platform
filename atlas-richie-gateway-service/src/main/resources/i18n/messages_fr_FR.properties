error.auth.token.invalid.meaning=Jeton invalide
error.auth.token.invalid.cause=La v\u00e9rification de la signature JWT a \u00e9chou\u00e9, le format est invalide ou le jeton a \u00e9t\u00e9 mis sur liste noire par un administrateur
error.auth.token.invalid.investigate=V\u00e9rifiez le format de l'en-t\u00eate de requ\u00eate Authorization, assurez-vous que la cl\u00e9 de signature correspond et que le client n'a pas \u00e9t\u00e9 modifi\u00e9 localement
error.auth.token.invalid.retry=Non
error.auth.token.missing.meaning=Jeton manquant
error.auth.token.missing.cause=La requ\u00eate ne contient pas l'en-t\u00eate Authorization ou le format de l'en-t\u00eate est incorrect
error.auth.token.missing.investigate=Assurez-vous que le client transmet correctement le jeton Bearer dans l'en-t\u00eate de la requ\u00eate
error.auth.token.missing.retry=Non
error.auth.token.expired.meaning=Jeton expir\u00e9
error.auth.token.expired.cause=La revendication exp du JWT a d\u00e9pass\u00e9 sa p\u00e9riode de validit\u00e9 ou a \u00e9t\u00e9 ajout\u00e9e \u00e0 la liste noire d'action
error.auth.token.expired.investigate=V\u00e9rifiez la date d'expiration du jeton et d\u00e9cidez s'il faut se reconnecter ou utiliser refresh_token pour le renouveler
error.auth.token.expired.retry=Non
error.auth.permission.denied.meaning=Permissions insuffisantes
error.auth.permission.denied.cause=L'utilisateur n'est pas autoris\u00e9 \u00e0 acc\u00e9der au point de terminaison ou \u00e0 la ressource cible
error.auth.permission.denied.investigate=V\u00e9rifiez la configuration des r\u00f4les/permissions de l'utilisateur et la liste de contr\u00f4le d'acc\u00e8s pour confirmer que le point de terminaison est inclus
error.auth.permission.denied.retry=Non
error.tenant.missing.meaning=Identifiant de locataire manquant
error.tenant.missing.cause=La requ\u00eate ne contient pas X-RD-Tenant-Code ou le jeton ne contient pas tenantId
error.tenant.missing.investigate=V\u00e9rifiez si le client transmet le code locataire dans l'en-t\u00eate de la requ\u00eate et si le jeton contient la revendication tenantId
error.tenant.missing.retry=Non
error.tenant.invalid.meaning=Informations de locataire invalides
error.tenant.invalid.cause=Le locataire a expir\u00e9, a \u00e9t\u00e9 d\u00e9sactiv\u00e9 ou pr\u00e9sente un \u00e9tat anormal
error.tenant.invalid.investigate=V\u00e9rifiez l'\u00e9tat et la date d'expiration du locataire, et contactez l'administrateur du locataire pour confirmer son \u00e9tat
error.tenant.invalid.retry=Non
error.rate.limited.meaning=Trop de requ\u00eates
error.rate.limited.cause=Une r\u00e8gle de limitation de d\u00e9bit Sentinel/QPS a \u00e9t\u00e9 d\u00e9clench\u00e9e ; la requ\u00eate du client a d\u00e9pass\u00e9 le seuil
error.rate.limited.investigate=V\u00e9rifiez la fr\u00e9quence des requ\u00eates du client et la configuration du seuil, et envisagez d'augmenter l'intervalle entre les tentatives
error.rate.limited.retry=Oui
error.upstream.unavailable.meaning=Service en amont indisponible
error.upstream.unavailable.cause=La connexion au microservice en amont a \u00e9chou\u00e9 ou a renvoy\u00e9 une r\u00e9ponse 5xx
error.upstream.unavailable.investigate=V\u00e9rifiez si le service en amont est en ligne, examinez les journaux de l'instance en aval et v\u00e9rifiez que la d\u00e9couverte de services fonctionne
error.upstream.unavailable.retry=Oui
error.upstream.timeout.meaning=D\u00e9lai de r\u00e9ponse du service en amont d\u00e9pass\u00e9
error.upstream.timeout.cause=Le service en amont n'a pas r\u00e9pondu dans le seuil de d\u00e9lai imparti
error.upstream.timeout.investigate=V\u00e9rifiez le temps de r\u00e9ponse du service en amont, la configuration du d\u00e9lai en aval et si le point de terminaison en amont doit \u00eatre optimis\u00e9
error.upstream.timeout.retry=Oui
error.system.internal.meaning=Erreur interne du syst\u00e8me
error.system.internal.cause=Une exception non intercept\u00e9e et non classifi\u00e9e dans la passerelle (pointeur nul, ressource indisponible, etc.) ; la classe d'exception sp\u00e9cifique a \u00e9t\u00e9 mapp\u00e9e \u00e0 ce code
error.system.internal.investigate=V\u00e9rifiez l'identifiant d'erreur dans les journaux de la passerelle et contactez l'exploitation pour inspecter l'\u00e9tat des services en aval
error.system.internal.retry=Non
error.route.not.found.meaning=Route introuvable
error.route.not.found.cause=Spring Cloud Gateway n'a associ\u00e9 aucune route en aval
error.route.not.found.investigate=V\u00e9rifiez que le chemin de la requ\u00eate est correct, que la table de routage contient cette URL et que les r\u00e8gles de correspondance de chemin sont en vigueur
error.route.not.found.retry=Non
error.req.bad.request.meaning=Param\u00e8tres de requ\u00eate invalides
error.req.bad.request.cause=La d\u00e9s\u00e9rialisation du corps de la requ\u00eate a \u00e9chou\u00e9, la validation des champs n'a pas abouti ou les param\u00e8tres de la requ\u00eate sont hors de la plage autoris\u00e9e
error.req.bad.request.investigate=V\u00e9rifiez le format JSON du corps de la requ\u00eate, validez les noms et types de champs et reportez-vous aux contraintes de param\u00e8tres de la documentation de l'API
error.req.bad.request.retry=Non
