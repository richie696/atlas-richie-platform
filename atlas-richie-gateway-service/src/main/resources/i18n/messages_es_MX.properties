error.auth.token.invalid.meaning=Token inv\u00e1lido
error.auth.token.invalid.cause=La verificaci\u00f3n de la firma JWT fall\u00f3, el formato no es v\u00e1lido o el token fue removido de la lista negra por un administrador
error.auth.token.invalid.investigate=Revise el formato del encabezado de solicitud Authorization, verifique que la clave de firma coincida y aseg\u00farese de que el cliente no haya sido modificado localmente
error.auth.token.invalid.retry=No
error.auth.token.missing.meaning=Token faltante
error.auth.token.missing.cause=La solicitud no incluye el encabezado Authorization o el formato del encabezado es incorrecto
error.auth.token.missing.investigate=Aseg\u00farese de que el cliente env\u00ede el token Bearer correctamente en el encabezado de la solicitud
error.auth.token.missing.retry=No
error.auth.token.expired.meaning=Token expirado
error.auth.token.expired.cause=La reclamaci\u00f3n exp del JWT ha superado su periodo de vigencia o se agreg\u00f3 a la lista negra de acciones
error.auth.token.expired.investigate=Revise el tiempo de expiraci\u00f3n del token y decida si debe iniciar sesi\u00f3n de nuevo o usar refresh_token para renovarlo
error.auth.token.expired.retry=No
error.auth.permission.denied.meaning=Permisos insuficientes
error.auth.permission.denied.cause=El usuario no est\u00e1 autorizado para acceder al endpoint o recurso de destino
error.auth.permission.denied.investigate=Revise la configuraci\u00f3n de roles/permisos del usuario y la lista de control de acceso para confirmar que el endpoint est\u00e1 incluido
error.auth.permission.denied.retry=No
error.tenant.missing.meaning=Identificador de inquilino faltante
error.tenant.missing.cause=La solicitud no incluye X-RD-Tenant-Code o el token no contiene tenantId
error.tenant.missing.investigate=Verifique si el cliente pasa el c\u00f3digo de inquilino en el encabezado de la solicitud y si el token contiene la reclamaci\u00f3n tenantId
error.tenant.missing.retry=No
error.tenant.invalid.meaning=Informaci\u00f3n de inquilino no v\u00e1lida
error.tenant.invalid.cause=El inquilino ha expirado, fue deshabilitado o se encuentra en un estado an\u00f3malo
error.tenant.invalid.investigate=Revise el estado y la fecha de expiraci\u00f3n del inquilino y contacte al administrador del inquilino para confirmar el estado
error.tenant.invalid.retry=No
error.rate.limited.meaning=Demasiadas solicitudes
error.rate.limited.cause=Se activ\u00f3 una regla de l\u00edmite de velocidad Sentinel/QPS; la solicitud del cliente super\u00f3 el umbral
error.rate.limited.investigate=Verifique la frecuencia de solicitudes del cliente y la configuraci\u00f3n del umbral, y considere aumentar el intervalo de reintentos
error.rate.limited.retry=S\u00ed
error.upstream.unavailable.meaning=Servicio de origen no disponible
error.upstream.unavailable.cause=La conexi\u00f3n con el microservicio de origen fall\u00f3 o devolvi\u00f3 una respuesta 5xx
error.upstream.unavailable.investigate=Verifique si el servicio de origen est\u00e1 en l\u00ednea, revise los registros de la instancia de destino y verifique que el descubrimiento de servicios est\u00e9 funcionando
error.upstream.unavailable.retry=S\u00ed
error.upstream.timeout.meaning=Tiempo de respuesta del servicio de origen agotado
error.upstream.timeout.cause=El servicio de origen no respondi\u00f3 dentro del umbral de tiempo de espera
error.upstream.timeout.investigate=Revise el tiempo de respuesta del servicio de origen, la configuraci\u00f3n del tiempo de espera del destino y si el endpoint de origen necesita optimizarse
error.upstream.timeout.retry=S\u00ed
error.system.internal.meaning=Error interno del sistema
error.system.internal.cause=Una excepci\u00f3n no capturada y no clasificada en la puerta de enlace (puntero nulo, recurso no disponible, etc.); la clase de excepci\u00f3n espec\u00edfica se asign\u00f3 a este c\u00f3digo
error.system.internal.investigate=Revise el ID de error en los registros de la puerta de enlace y contacte a operaciones para inspeccionar el estado de los servicios de destino
error.system.internal.retry=No
error.route.not.found.meaning=Ruta no encontrada
error.route.not.found.cause=Spring Cloud Gateway no encontr\u00f3 ninguna ruta de destino que coincida
error.route.not.found.investigate=Verifique que la ruta de la solicitud sea correcta, que la tabla de rutas contenga esta URL y que las reglas de coincidencia de rutas est\u00e9n vigentes
error.route.not.found.retry=No
error.req.bad.request.meaning=Par\u00e1metros de solicitud incorrectos
error.req.bad.request.cause=La deserializaci\u00f3n del cuerpo de la solicitud fall\u00f3, la validaci\u00f3n de campos no pas\u00f3 o los par\u00e1metros de la solicitud est\u00e1n fuera del rango permitido
error.req.bad.request.investigate=Revise el formato JSON del cuerpo de la solicitud, verifique los nombres y tipos de los campos y consulte las restricciones de par\u00e1metros en la documentaci\u00f3n de la API
error.req.bad.request.retry=No
