error.auth.token.invalid.meaning=Ugyldigt token
error.auth.token.invalid.cause=JWT-signaturverifikation mislykkedes, formatet er ugyldigt, eller tokenet er fjernet fra sortlisten af en administrator
error.auth.token.invalid.investigate=Kontroll\u00E9r formatet p\u00E5 Authorization-headeren, at n\u00F8glerne matcher, og at klienten ikke er lokalt \u00E6ndret
error.auth.token.invalid.retry=Nej
error.auth.token.missing.meaning=Token mangler
error.auth.token.missing.cause=Anmodningen mangler Authorization-header eller har ugyldigt format
error.auth.token.missing.investigate=S\u00F8rg for, at klienten sender Bearer-token korrekt i headeren
error.auth.token.missing.retry=Nej
error.auth.token.expired.meaning=Token er udl\u00F8bet
error.auth.token.expired.cause=JWT-feltet exp har overskredet gyldighedsperioden, eller tokenet er f\u00F8jet til sortlisten
error.auth.token.expired.investigate=Kontroll\u00E9r tokenets udl\u00F8bstid, log ind igen om n\u00F8dvendigt, eller brug refresh_token til at forny
error.auth.token.expired.retry=Nej
error.auth.permission.denied.meaning=Utilstr\u00E6kkelige rettigheder
error.auth.permission.denied.cause=Brugeren har ikke tilladelse til at f\u00E5 adgang til det anmodede gr\u00E6nseflade eller ressource
error.auth.permission.denied.investigate=Kontroll\u00E9r brugerens roller og rettigheder, samt at adgangskontroltabellen indeholder denne gr\u00E6nseflade
error.auth.permission.denied.retry=Nej
error.tenant.missing.meaning=Lejer-ID mangler
error.tenant.missing.cause=Anmodningen mangler X-RD-Tenant-Code, eller tokenet indeholder ikke tenantId
error.tenant.missing.investigate=Kontroll\u00E9r, at klienten sender lejerkoden i headeren, og at tokenet indeholder p\u00E5standen tenantId
error.tenant.missing.retry=Nej
error.tenant.invalid.meaning=Ugyldige lejerdata
error.tenant.invalid.cause=Lejeren er udl\u00F8bet, deaktiveret eller i unormal tilstand
error.tenant.invalid.investigate=Kontroll\u00E9r lejerens status og udl\u00F8bsdato, og kontakt lejerens administrator for bekr\u00E6ftelse
error.tenant.invalid.retry=Nej
error.rate.limited.meaning=For hyppige anmodninger
error.rate.limited.cause=Sentinels QPS-begr\u00E6nsningsregel blev udl\u00F8st, klienten overskred anmodningsgr\u00E6nsen
error.rate.limited.investigate=Kontroll\u00E9r klientens anmodningsfrekvens, t\u00E6rskelindstillinger og muligheden for at \u00F8ge intervallet mellem nye fors\u00F8g
error.rate.limited.retry=Ja
error.upstream.unavailable.meaning=Opstr\u00F8mstjeneste er utilg\u00E6ngelig
error.upstream.unavailable.cause=Der kunne ikke oprettes forbindelse til den opstr\u00F8ms mikrotjeneste, eller den returnerede 5xx
error.upstream.unavailable.investigate=Kontroll\u00E9r, at opstr\u00F8mstjenesten er online, gennemg\u00E5 logfilerne for nedstr\u00F8ms instanser, og verific\u00E9r, at tjenesteopdagelsen fungerer
error.upstream.unavailable.retry=Ja
error.upstream.timeout.meaning=Tidsgr\u00E6nsen for svar fra opstr\u00F8mstjeneste er overskredet
error.upstream.timeout.cause=Opstr\u00F8mstjenesten svarede ikke inden for tidsgr\u00E6nsen
error.upstream.timeout.investigate=Kontroll\u00E9r opstr\u00F8mstjenestens svartid, den nedstr\u00F8ms nodes tidsgr\u00E6nseindstillinger og vurder behovet for at optimere gr\u00E6nsefladen
error.upstream.timeout.retry=Ja
error.system.internal.meaning=Intern systemfejl
error.system.internal.cause=En uklassificeret ufanget undtagelse i gatewayen (NullPointerException, ressource utilg\u00E6ngelig osv.) er knyttet til denne kode
error.system.internal.investigate=Find fejl-ID'et i gateway-logfiler, og kontakt driftspersonalet for at kontrollere status for nedstr\u00F8mstjenester
error.system.internal.retry=Nej
error.route.not.found.meaning=Rute ikke fundet
error.route.not.found.cause=Spring Cloud Gateway matchede ingen nedstr\u00F8ms rute
error.route.not.found.investigate=Kontroll\u00E9r, at anmodningsstien er korrekt, at rutetabellen indeholder denne URL, og at matchningsreglerne er aktive
error.route.not.found.retry=Nej
error.req.bad.request.meaning=Ugyldige parametre i anmodningen
error.req.bad.request.cause=Anmodningens krop kunne ikke deserialiseres, feltvalidering mislykkedes, eller parametrene ligger uden for det tilladte omr\u00E5de
error.req.bad.request.investigate=Kontroll\u00E9r JSON-formatet i anmodningens krop, at feltnavne og -typer er korrekte, og sammenlign med begr\u00E6nsningerne i gr\u00E6nsefladedokumentationen
error.req.bad.request.retry=Nej
