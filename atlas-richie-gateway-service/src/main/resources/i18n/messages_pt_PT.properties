error.auth.token.invalid.meaning=Token inv\u00e1lido
error.auth.token.invalid.cause=A verifica\u00e7\u00e3o da assinatura JWT falhou, o formato \u00e9 inv\u00e1lido ou o token foi removido da lista negra por um administrador
error.auth.token.invalid.investigate=Verifique o formato do cabe\u00e7alho de pedido Authorization, confirme que a chave de assinatura coincide e certifique-se de que o cliente n\u00e3o foi modificado localmente
error.auth.token.invalid.retry=N\u00e3o
error.auth.token.missing.meaning=Token em falta
error.auth.token.missing.cause=O pedido n\u00e3o transporta o cabe\u00e7alho Authorization ou o formato do cabe\u00e7alho est\u00e1 incorreto
error.auth.token.missing.investigate=Certifique-se de que o cliente transporta o token Bearer corretamente no cabe\u00e7alho do pedido
error.auth.token.missing.retry=N\u00e3o
error.auth.token.expired.meaning=Token expirado
error.auth.token.expired.cause=A claims exp do JWT ultrapassou o per\u00edodo de validade ou foi adicionada \u00e0 lista negra de a\u00e7\u00f5es
error.auth.token.expired.investigate=Verifique o tempo de expira\u00e7\u00e3o do token e decida se \u00e9 necess\u00e1rio iniciar sess\u00e3o novamente ou usar refresh_token para o renovar
error.auth.token.expired.retry=N\u00e3o
error.auth.permission.denied.meaning=Permiss\u00f5es insuficientes
error.auth.permission.denied.cause=O utilizador n\u00e3o est\u00e1 autorizado a aceder ao endpoint ou recurso de destino
error.auth.permission.denied.investigate=Verifique a configura\u00e7\u00e3o de fun\u00e7\u00f5es/permiss\u00f5es do utilizador e a lista de controlo de acesso para confirmar que o endpoint est\u00e1 inclu\u00eddo
error.auth.permission.denied.retry=N\u00e3o
error.tenant.missing.meaning=Identificador de inquilino em falta
error.tenant.missing.cause=O pedido n\u00e3o transporta X-RD-Tenant-Code ou o token n\u00e3o cont\u00e9m tenantId
error.tenant.missing.investigate=Verifique se o cliente envia o c\u00f3digo de inquilino no cabe\u00e7alho do pedido e se o token cont\u00e9m a claims tenantId
error.tenant.missing.retry=N\u00e3o
error.tenant.invalid.meaning=Informa\u00e7\u00f5es de inquilino inv\u00e1lidas
error.tenant.invalid.cause=O inquilino expirou, foi desativado ou encontra-se num estado an\u00f3malo
error.tenant.invalid.investigate=Verifique o estado e a data de expira\u00e7\u00e3o do inquilino e contacte o administrador do inquilino para confirmar o estado
error.tenant.invalid.retry=N\u00e3o
error.rate.limited.meaning=Demasiados pedidos
error.rate.limited.cause=Foi acionada uma regra de limita\u00e7\u00e3o de taxa Sentinel/QPS; o pedido do cliente excedeu o limiar
error.rate.limited.investigate=Verifique a frequ\u00eancia de pedidos do cliente e a configura\u00e7\u00e3o do limiar, e considere aumentar o intervalo entre tentativas
error.rate.limited.retry=Sim
error.upstream.unavailable.meaning=Servi\u00e7o a montante indispon\u00edvel
error.upstream.unavailable.cause=A liga\u00e7\u00e3o ao microsservi\u00e7o a montante falhou ou devolveu uma resposta 5xx
error.upstream.unavailable.investigate=Verifique se o servi\u00e7o a montante est\u00e1 online, examine os registos da inst\u00e2ncia a jusante e confirme que a descoberta de servi\u00e7os est\u00e1 a funcionar
error.upstream.unavailable.retry=Sim
error.upstream.timeout.meaning=Tempo de resposta do servi\u00e7o a montante esgotado
error.upstream.timeout.cause=O servi\u00e7o a montante n\u00e3o respondeu dentro do limiar de tempo limite
error.upstream.timeout.investigate=Verifique o tempo de resposta do servi\u00e7o a montante, a configura\u00e7\u00e3o de tempo limite a jusante e se o endpoint a montante precisa de ser otimizado
error.upstream.timeout.retry=Sim
error.system.internal.meaning=Erro interno do sistema
error.system.internal.cause=Uma exce\u00e7\u00e3o n\u00e3o intercetada e n\u00e3o classificada no gateway (ponteiro nulo, recurso indispon\u00edvel, etc.); a classe de exce\u00e7\u00e3o espec\u00edfica foi mapeada para este c\u00f3digo
error.system.internal.investigate=Verifique o ID do erro nos registos do gateway e contacte as opera\u00e7\u00f5es para inspecionar o estado dos servi\u00e7os a jusante
error.system.internal.retry=N\u00e3o
error.route.not.found.meaning=Rota n\u00e3o encontrada
error.route.not.found.cause=O Spring Cloud Gateway n\u00e3o associou nenhuma rota a jusante
error.route.not.found.investigate=Verifique se o caminho do pedido est\u00e1 correto, se a tabela de rotas cont\u00e9m este URL e se as regras de correspond\u00eancia de caminho est\u00e3o em vigor
error.route.not.found.retry=N\u00e3o
error.req.bad.request.meaning=Par\u00e2metros de pedido inv\u00e1lidos
error.req.bad.request.cause=A desserializa\u00e7\u00e3o do corpo do pedido falhou, a valida\u00e7\u00e3o dos campos n\u00e3o passou ou os par\u00e2metros do pedido est\u00e3o fora do intervalo permitido
error.req.bad.request.investigate=Verifique o formato JSON do corpo do pedido, confirme os nomes e tipos dos campos e consulte as restri\u00e7\u00f5es de par\u00e2metros na documenta\u00e7\u00e3o da API
error.req.bad.request.retry=N\u00e3o
