error.auth.token.invalid.meaning=Token non valido
error.auth.token.invalid.cause=Verifica della firma JWT non riuscita, formato non valido o token rimosso dalla blacklist da un amministratore
error.auth.token.invalid.investigate=Verifica il formato dell'header della richiesta Authorization, assicurati che la chiave di firma corrisponda e che il client non sia stato modificato localmente
error.auth.token.invalid.retry=No
error.auth.token.missing.meaning=Token mancante
error.auth.token.missing.cause=La richiesta non include l'header Authorization o il formato dell'header \u00e8 errato
error.auth.token.missing.investigate=Assicurati che il client trasmetta correttamente il token Bearer nell'header della richiesta
error.auth.token.missing.retry=No
error.auth.token.expired.meaning=Token scaduto
error.auth.token.expired.cause=Il claim exp del JWT ha superato il periodo di validit\u00e0 o \u00e8 stato aggiunto alla blacklist delle azioni
error.auth.token.expired.investigate=Controlla il tempo di scadenza del token e decidi se \u00e8 necessario effettuare nuovamente l'accesso o utilizzare refresh_token per rinnovarlo
error.auth.token.expired.retry=No
error.auth.permission.denied.meaning=Permessi insufficienti
error.auth.permission.denied.cause=L'utente non \u00e8 autorizzato ad accedere all'endpoint o alla risorsa di destinazione
error.auth.permission.denied.investigate=Verifica la configurazione di ruoli/permessi dell'utente e l'elenco di controllo degli accessi per confermare che l'endpoint sia incluso
error.auth.permission.denied.retry=No
error.tenant.missing.meaning=Identificativo tenant mancante
error.tenant.missing.cause=La richiesta non include X-RD-Tenant-Code o il token non contiene tenantId
error.tenant.missing.investigate=Verifica se il client passa il codice tenant nell'header della richiesta e se il token contiene il claim tenantId
error.tenant.missing.retry=No
error.tenant.invalid.meaning=Informazioni tenant non valide
error.tenant.invalid.cause=Il tenant \u00e8 scaduto, \u00e8 stato disabilitato o si trova in uno stato anomalo
error.tenant.invalid.investigate=Controlla lo stato e la data di scadenza del tenant e contatta l'amministratore del tenant per confermarne lo stato
error.tenant.invalid.retry=No
error.rate.limited.meaning=Troppe richieste
error.rate.limited.cause=\u00c8 stata attivata una regola di limitazione della velocit\u00e0 Sentinel/QPS; la richiesta del client ha superato la soglia
error.rate.limited.investigate=Verifica la frequenza delle richieste del client e la configurazione della soglia, e valuta di aumentare l'intervallo tra i tentativi
error.rate.limited.retry=S\u00ec
error.upstream.unavailable.meaning=Servizio a monte non disponibile
error.upstream.unavailable.cause=La connessione al microservizio a monte non \u00e8 riuscita o ha restituito una risposta 5xx
error.upstream.unavailable.investigate=Verifica se il servizio a monte \u00e8 online, esamina i log dell'istanza a valle e accertati che il service discovery funzioni
error.upstream.unavailable.retry=S\u00ec
error.upstream.timeout.meaning=Timeout di risposta del servizio a monte
error.upstream.timeout.cause=Il servizio a monte non ha risposto entro la soglia di timeout
error.upstream.timeout.investigate=Controlla il tempo di risposta del servizio a monte, la configurazione del timeout a valle e se \u00e8 necessario ottimizzare l'endpoint a monte
error.upstream.timeout.retry=S\u00ec
error.system.internal.meaning=Errore interno del sistema
error.system.internal.cause=Un'eccezione non intercettata e non classificata nel gateway (puntatore nullo, risorsa non disponibile, ecc.); la classe di eccezione specifica \u00e8 stata mappata a questo codice
error.system.internal.investigate=Controlla l'ID errore nei log del gateway e contatta l'operativit\u00e0 per ispezionare lo stato dei servizi a valle
error.system.internal.retry=No
error.route.not.found.meaning=Route non trovata
error.route.not.found.cause=Spring Cloud Gateway non ha associato alcuna route a valle
error.route.not.found.investigate=Verifica che il percorso della richiesta sia corretto, che la tabella di routing contenga questo URL e che le regole di corrispondenza del percorso siano attive
error.route.not.found.retry=No
error.req.bad.request.meaning=Parametri di richiesta non validi
error.req.bad.request.cause=Deserializzazione del corpo della richiesta non riuscita, convalida dei campi non superata o parametri di richiesta fuori dall'intervallo consentito
error.req.bad.request.investigate=Controlla il formato JSON del corpo della richiesta, verifica i nomi e i tipi dei campi e fai riferimento ai vincoli dei parametri nella documentazione dell'API
error.req.bad.request.retry=No
