error.auth.token.invalid.meaning=Ugyldig token
error.auth.token.invalid.cause=JWT-signaturverifisering mislyktes, formatet er ugyldig, eller tokenet er fjernet fra svartelisten av en administrator
error.auth.token.invalid.investigate=Kontroller formatet p\u00E5 Authorization-headeren, at n\u00F8klene stemmer overens, og at klienten ikke er lokalt endret
error.auth.token.invalid.retry=Nei
error.auth.token.missing.meaning=Token mangler
error.auth.token.missing.cause=Foresp\u00F8rselen mangler Authorization-header eller har ugyldig format
error.auth.token.missing.investigate=S\u00F8rg for at klienten sender Bearer-tokenet korrekt i headeren
error.auth.token.missing.retry=Nei
error.auth.token.expired.meaning=Tokenet er utl\u00F8pt
error.auth.token.expired.cause=JWT-feltet exp har overskredet gyldighetstiden, eller tokenet er lagt til svartelisten
error.auth.token.expired.investigate=Kontroller utl\u00F8pstiden for tokenet, logg inn p\u00E5 nytt ved behov eller bruk refresh_token for \u00E5 fornye
error.auth.token.expired.retry=Nei
error.auth.permission.denied.meaning=Utilstrekkelige rettigheter
error.auth.permission.denied.cause=Brukeren har ikke tillatelse til \u00E5 f\u00E5 tilgang til det forespurte grensesnittet eller ressursen
error.auth.permission.denied.investigate=Kontroller brukerens roller og tillatelser, og at tilgangskontrolltabellen inneholder dette grensesnittet
error.auth.permission.denied.retry=Nei
error.tenant.missing.meaning=Mangler leietaker-ID
error.tenant.missing.cause=Foresp\u00F8rselen mangler X-RD-Tenant-Code, eller tokenet inneholder ikke tenantId
error.tenant.missing.investigate=Kontroller at klienten sender leietakerkoden i headeren, og at tokenet inneholder p\u00E5standen tenantId
error.tenant.missing.retry=Nei
error.tenant.invalid.meaning=Ugyldige leietakerdata
error.tenant.invalid.cause=Leietakeren er utl\u00F8pt, deaktivert eller i unormal tilstand
error.tenant.invalid.investigate=Kontroller leietakerens status og utl\u00F8psdato, og ta kontakt med leietakerens administrator for \u00E5 bekrefte
error.tenant.invalid.retry=Nei
error.rate.limited.meaning=For hyppige foresp\u00F8rsler
error.rate.limited.cause=Sentinels QPS-begrensningsregel ble utl\u00F8st, klienten overskred foresp\u00F8rselsgrensen
error.rate.limited.investigate=Kontroller klientens foresp\u00F8rselsfrekvens, terskelinnstillinger og muligheten til \u00E5 \u00F8ke intervallet mellom nye fors\u00F8k
error.rate.limited.retry=Ja
error.upstream.unavailable.meaning=Oppstr\u00F8mstjeneste er utilgjengelig
error.upstream.unavailable.cause=Tilkoblingen til oppstr\u00F8ms mikrotjeneste mislyktes, eller den returnerte 5xx
error.upstream.unavailable.investigate=Kontroller at oppstr\u00F8mstjenesten kj\u00F8rer, se gjennom loggene til nedstr\u00F8ms instanser, og verifiser at tjenesteoppdagelsen fungerer
error.upstream.unavailable.retry=Ja
error.upstream.timeout.meaning=Oppstr\u00F8mstjenesten svarte for sent
error.upstream.timeout.cause=Oppstr\u00F8mstjenesten svarte ikke innen tidsgrensen
error.upstream.timeout.investigate=Kontroller oppstr\u00F8mstjenestens responstid, nedstr\u00F8ms tidsgrenseinnstillinger og vurder behovet for \u00E5 optimalisere grensesnittet
error.upstream.timeout.retry=Ja
error.system.internal.meaning=Intern systemfeil
error.system.internal.cause=En uklassifisert uoppdaget unntak i gatewayen (NullPointerException, ressurs utilgjengelig osv.) er tilordnet denne koden
error.system.internal.investigate=Finn feil-ID-en i gateway-logger og kontakt driftspersonell for \u00E5 kontrollere statusen til nedstr\u00F8mstjenester
error.system.internal.retry=Nei
error.route.not.found.meaning=Rute ikke funnet
error.route.not.found.cause=Spring Cloud Gateway matchet ingen nedstr\u00F8ms rute
error.route.not.found.investigate=Kontroller at foresp\u00F8rselsstien er korrekt, at rutetabellen inneholder denne URL-en, og at matchingsreglene er aktive
error.route.not.found.retry=Nei
error.req.bad.request.meaning=Ugyldige parametere i foresp\u00F8rselen
error.req.bad.request.cause=Klarte ikke \u00E5 deserialisere foresp\u00F8rselskroppen, feltvalidering mislyktes, eller parametere er utenfor tillatt omr\u00E5de
error.req.bad.request.investigate=Kontroller JSON-formatet i foresp\u00F8rselskroppen, at feltnavn og -typer er korrekte, og se parameterbegrensningene i grensesnittdokumentasjonen
error.req.bad.request.retry=Nei
