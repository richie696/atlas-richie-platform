MSG_GATEWAY_TIP_7=La autenticaci\u00F3n SSO fall\u00F3, por favor intente nuevamente.
MSG_GATEWAY_TIP_8=La cuenta actual ha iniciado sesi\u00F3n en otro lugar, por favor inicie sesi\u00F3n nuevamente.
