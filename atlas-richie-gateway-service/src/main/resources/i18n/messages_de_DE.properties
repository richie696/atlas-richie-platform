error.auth.token.invalid.meaning=Ung\u00fcltiges Token
error.auth.token.invalid.cause=JWT-Signaturpr\u00fcfung fehlgeschlagen, das Format ist ung\u00fcltig oder das Token wurde vom Administrator auf die Blacklist gesetzt
error.auth.token.invalid.investigate=\u00dcberpr\u00fcfen Sie das Format des Authorization-Anfrage-Headers, vergewissern Sie sich, dass der Signaturschl\u00fcssel \u00fcbereinstimmt, und stellen Sie sicher, dass der Client nicht lokal ver\u00e4ndert wurde
error.auth.token.invalid.retry=Nein
error.auth.token.missing.meaning=Token fehlt
error.auth.token.missing.cause=Die Anfrage enth\u00e4lt keinen Authorization-Header oder das Header-Format ist falsch
error.auth.token.missing.investigate=Stellen Sie sicher, dass der Client das Bearer-Token korrekt im Anfrage-Header mitsendet
error.auth.token.missing.retry=Nein
error.auth.token.expired.meaning=Token abgelaufen
error.auth.token.expired.cause=Der JWT-exp-Anspruch hat den G\u00fcltigkeitszeitraum \u00fcberschritten oder wurde auf die Aktions-Blacklist gesetzt
error.auth.token.expired.investigate=\u00dcberpr\u00fcfen Sie die Ablaufzeit des Tokens und entscheiden Sie, ob eine erneute Anmeldung oder eine Erneuerung mit refresh_token erforderlich ist
error.auth.token.expired.retry=Nein
error.auth.permission.denied.meaning=Unzureichende Berechtigungen
error.auth.permission.denied.cause=Der Benutzer ist nicht berechtigt, auf den Ziel-Endpunkt oder die Ressource zuzugreifen
error.auth.permission.denied.investigate=\u00dcberpr\u00fcfen Sie die Benutzerrollen- und Berechtigungskonfiguration sowie die Zugriffssteuerungsliste, um zu best\u00e4tigen, dass der Endpunkt enthalten ist
error.auth.permission.denied.retry=Nein
error.tenant.missing.meaning=Mandantenkennung fehlt
error.tenant.missing.cause=Die Anfrage enth\u00e4lt kein X-RD-Tenant-Code oder das Token enth\u00e4lt keinen tenantId
error.tenant.missing.investigate=\u00dcberpr\u00fcfen Sie, ob der Client den Mandantencode im Anfrage-Header \u00fcbergibt und ob das Token den tenantId-Anspruch enth\u00e4lt
error.tenant.missing.retry=Nein
error.tenant.invalid.meaning=Ung\u00fcltige Mandanteninformationen
error.tenant.invalid.cause=Der Mandant ist abgelaufen, wurde deaktiviert oder befindet sich in einem anormalen Status
error.tenant.invalid.investigate=\u00dcberpr\u00fcfen Sie den Mandantenstatus und das Ablaufdatum, und wenden Sie sich an den Mandantenadministrator, um den Status zu best\u00e4tigen
error.tenant.invalid.retry=Nein
error.rate.limited.meaning=Zu viele Anfragen
error.rate.limited.cause=Eine Sentinel/QPS-Durchsatzbegrenzungsregel wurde ausgel\u00f6st; die Client-Anfrage hat den Schwellenwert \u00fcberschritten
error.rate.limited.investigate=\u00dcberpr\u00fcfen Sie die Anfrageh\u00e4ufigkeit des Clients und die Schwellenwertkonfiguration, und erw\u00e4gen Sie eine Vergr\u00f6\u00dferung des Wiederholungsintervalls
error.rate.limited.retry=Ja
error.upstream.unavailable.meaning=Vorgelagerter Dienst nicht verf\u00fcgbar
error.upstream.unavailable.cause=Die Verbindung zum vorgelagerten Microservice ist fehlgeschlagen oder hat eine 5xx-Antwort zur\u00fcckgegeben
error.upstream.unavailable.investigate=\u00dcberpr\u00fcfen Sie, ob der vorgelagerte Dienst online ist, pr\u00fcfen Sie die Protokolle der nachgelagerten Instanzen und vergewissern Sie sich, dass die Service-Discovery funktioniert
error.upstream.unavailable.retry=Ja
error.upstream.timeout.meaning=Antwortzeit\u00fcberschreitung des vorgelagerten Dienstes
error.upstream.timeout.cause=Der vorgelagerte Dienst hat innerhalb des Timeout-Schwellenwerts nicht geantwortet
error.upstream.timeout.investigate=\u00dcberpr\u00fcfen Sie die Antwortzeit des vorgelagerten Dienstes, die Timeout-Konfiguration der nachgelagerten Seite und ob der vorgelagerte Endpunkt optimiert werden muss
error.upstream.timeout.retry=Ja
error.system.internal.meaning=Interner Systemfehler
error.system.internal.cause=Eine nicht abgefangene, nicht klassifizierte Ausnahme im Gateway (Nullzeiger, nicht verf\u00fcgbare Ressource usw.); die spezifische Ausnahmeklasse wurde diesem Code zugeordnet
error.system.internal.investigate=\u00dcberpr\u00fcfen Sie die Fehler-ID in den Gateway-Protokollen und wenden Sie sich an den Betrieb, um den Status der nachgelagerten Dienste zu pr\u00fcfen
error.system.internal.retry=Nein
error.route.not.found.meaning=Route nicht gefunden
error.route.not.found.cause=Spring Cloud Gateway hat keine nachgelagerte Route zugeordnet
error.route.not.found.investigate=\u00dcberpr\u00fcfen Sie, ob der Anfragepfad korrekt ist, ob die Routentabelle diese URL enth\u00e4lt und ob die Pfadabgleichsregeln wirksam sind
error.route.not.found.retry=Nein
error.req.bad.request.meaning=Ung\u00fcltige Anfrageparameter
error.req.bad.request.cause=Deserialisierung des Anfragek\u00f6rpers fehlgeschlagen, Feldvalidierung nicht bestanden oder Anfrageparameter au\u00dferhalb des zul\u00e4ssigen Bereichs
error.req.bad.request.investigate=\u00dcberpr\u00fcfen Sie das JSON-Format des Anfragek\u00f6rpers, verifizieren Sie die Feldnamen und -typen und beachten Sie die Parametereinschr\u00e4nkungen in der API-Dokumentation
error.req.bad.request.retry=Nein
