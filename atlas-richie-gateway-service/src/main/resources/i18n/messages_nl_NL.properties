error.auth.token.invalid.meaning=Token ongeldig
error.auth.token.invalid.cause=JWT-handtekeningverificatie mislukt, indeling is ongeldig of het token is door een beheerder van de zwarte lijst verwijderd
error.auth.token.invalid.investigate=Controleer de indeling van de Authorization-header, verifieer dat de sleutel overeenkomt en zorg dat de client niet lokaal is overschreven
error.auth.token.invalid.retry=Nee
error.auth.token.missing.meaning=Token ontbreekt
error.auth.token.missing.cause=De aanvraag bevat geen Authorization-header of de indeling is onjuist
error.auth.token.missing.investigate=Zorg dat de client het Bearer-token correct in de aanvraagheader meestuurt
error.auth.token.missing.retry=Nee
error.auth.token.expired.meaning=Token verlopen
error.auth.token.expired.cause=Het veld JWT exp ligt buiten de geldigheidsduur of het token is op de zwarte lijst geplaatst
error.auth.token.expired.investigate=Controleer de vervaldatum van het token, of opnieuw inloggen nodig is of verlenging via refresh_token mogelijk is
error.auth.token.expired.retry=Nee
error.auth.permission.denied.meaning=Onvoldoende rechten
error.auth.permission.denied.cause=De gebruiker is niet gemachtigd voor de doelinterface of bron
error.auth.permission.denied.investigate=Controleer de rol-/rechtenconfiguratie van de gebruiker en of de toegangscontrolelijst deze interface bevat
error.auth.permission.denied.retry=Nee
error.tenant.missing.meaning=Tenant-ID ontbreekt
error.tenant.missing.cause=De aanvraag bevat geen X-RD-Tenant-Code of het token bevat geen tenantId
error.tenant.missing.investigate=Controleer of de client de tenantcode in de aanvraagheader verstuurt en of het token de claim tenantId bevat
error.tenant.missing.retry=Nee
error.tenant.invalid.meaning=Tenantinformatie ongeldig
error.tenant.invalid.cause=De tenant is verlopen, uitgeschakeld of verkeerd in een afwijkende status
error.tenant.invalid.investigate=Controleer de tenantstatus/-verloopdatum en neem contact op met de tenantbeheerder om de status te bevestigen
error.tenant.invalid.retry=Nee
error.rate.limited.meaning=Te veel verzoeken
error.rate.limited.cause=Sentinel/QPS-limietregel geactiveerd, het aantal clientverzoeken ligt boven de drempel
error.rate.limited.investigate=Controleer de verzoekfrequentie van de client, de drempelconfiguratie en of het pogingsinterval kan worden verhoogd
error.rate.limited.retry=Ja
error.upstream.unavailable.meaning=Upstream-service niet beschikbaar
error.upstream.unavailable.cause=Verbinding met upstream-microservice mislukt of upstream gaf 5xx terug
error.upstream.unavailable.investigate=Controleer of de upstream-service online is, bekijk de logs van de downstream-instanties en verifieer dat service-discovery werkt
error.upstream.unavailable.retry=Ja
error.upstream.timeout.meaning=Upstream-service time-out
error.upstream.timeout.cause=De upstream-service reageerde niet binnen de time-outdrempel
error.upstream.timeout.investigate=Controleer de responstijd van de upstream-service, de time-outconfiguratie aan downstream-zijde en of de upstream-interface geoptimaliseerd moet worden
error.upstream.timeout.retry=Ja
error.system.internal.meaning=Interne systeemfout
error.system.internal.cause=Een niet-geclassificeerde uitzondering die door de gateway niet is afgevangen (null pointer, bron niet beschikbaar, enz.) is naar deze code gemapt
error.system.internal.investigate=Controleer de fout-ID in de gatewaylog en neem contact op met operations om de downstream-servicestatus te verifi\u00EBren
error.system.internal.retry=Nee
error.route.not.found.meaning=Route niet gevonden
error.route.not.found.cause=Spring Cloud Gateway kon geen downstream-route matchen
error.route.not.found.investigate=Controleer of het aanvraagpad correct is, de routetabel deze URL bevat en de padmatchingsregels van kracht zijn
error.route.not.found.retry=Nee
error.req.bad.request.meaning=Ongeldige aanvraagparameters
error.req.bad.request.cause=Deserialisatie van de aanvraagbody mislukt, veldvalidatie geweigerd of parameters buiten het toegestane bereik
error.req.bad.request.investigate=Controleer de JSON-indeling van de aanvraagbody, juistheid van veldnamen/-types en de parameterbeperkingen in de interfacedocumentatie
error.req.bad.request.retry=Nee
