error.auth.token.invalid.meaning=Token inv\u00e1lido
error.auth.token.invalid.cause=A verifica\u00e7\u00e3o da assinatura JWT falhou, o formato \u00e9 inv\u00e1lido ou o token foi removido da lista negra por um administrador
error.auth.token.invalid.investigate=Verifique o formato do cabe\u00e7alho de requisi\u00e7\u00e3o Authorization, confirme se a chave de assinatura coincide e certifique-se de que o cliente n\u00e3o foi modificado localmente
error.auth.token.invalid.retry=N\u00e3o
error.auth.token.missing.meaning=Token ausente
error.auth.token.missing.cause=A requisi\u00e7\u00e3o n\u00e3o carrega o cabe\u00e7alho Authorization ou o formato do cabe\u00e7alho est\u00e1 incorreto
error.auth.token.missing.investigate=Certifique-se de que o cliente envie o token Bearer corretamente no cabe\u00e7alho da requisi\u00e7\u00e3o
error.auth.token.missing.retry=N\u00e3o
error.auth.token.expired.meaning=Token expirado
error.auth.token.expired.cause=A claim exp do JWT ultrapassou o per\u00edodo de validade ou foi adicionada \u00e0 lista negra de a\u00e7\u00f5es
error.auth.token.expired.investigate=Verifique o tempo de expira\u00e7\u00e3o do token e decida se \u00e9 necess\u00e1rio fazer login novamente ou usar refresh_token para renovar
error.auth.token.expired.retry=N\u00e3o
error.auth.permission.denied.meaning=Permiss\u00f5es insuficientes
error.auth.permission.denied.cause=O usu\u00e1rio n\u00e3o est\u00e1 autorizado a acessar o endpoint ou recurso de destino
error.auth.permission.denied.investigate=Verifique a configura\u00e7\u00e3o de fun\u00e7\u00e3o/permiss\u00f5es do usu\u00e1rio e a lista de controle de acesso para confirmar que o endpoint est\u00e1 inclu\u00eddo
error.auth.permission.denied.retry=N\u00e3o
error.tenant.missing.meaning=Identificador de inquilino ausente
error.tenant.missing.cause=A requisi\u00e7\u00e3o n\u00e3o carrega X-RD-Tenant-Code ou o token n\u00e3o cont\u00e9m tenantId
error.tenant.missing.investigate=Verifique se o cliente envia o c\u00f3digo do inquilino no cabe\u00e7alho da requisi\u00e7\u00e3o e se o token cont\u00e9m a claim tenantId
error.tenant.missing.retry=N\u00e3o
error.tenant.invalid.meaning=Informa\u00e7\u00f5es de inquilino inv\u00e1lidas
error.tenant.invalid.cause=O inquilino expirou, foi desabilitado ou est\u00e1 em um estado an\u00f4malo
error.tenant.invalid.investigate=Verifique o status e a data de expira\u00e7\u00e3o do inquilino e entre em contato com o administrador do inquilino para confirmar o status
error.tenant.invalid.retry=N\u00e3o
error.rate.limited.meaning=Muitas requisi\u00e7\u00f5es
error.rate.limited.cause=Uma regra de limite de taxa Sentinel/QPS foi acionada; a requisi\u00e7\u00e3o do cliente excedeu o limite
error.rate.limited.investigate=Verifique a frequ\u00eancia de requisi\u00e7\u00f5es do cliente e a configura\u00e7\u00e3o do limite, e considere aumentar o intervalo entre as tentativas
error.rate.limited.retry=Sim
error.upstream.unavailable.meaning=Servi\u00e7o upstream indispon\u00edvel
error.upstream.unavailable.cause=A conex\u00e3o com o microsservi\u00e7o upstream falhou ou retornou uma resposta 5xx
error.upstream.unavailable.investigate=Verifique se o servi\u00e7o upstream est\u00e1 online, examine os registros da inst\u00e2ncia downstream e confirme se a descoberta de servi\u00e7os est\u00e1 funcionando
error.upstream.unavailable.retry=Sim
error.upstream.timeout.meaning=Tempo de resposta do servi\u00e7o upstream esgotado
error.upstream.timeout.cause=O servi\u00e7o upstream n\u00e3o respondeu dentro do limite de tempo limite
error.upstream.timeout.investigate=Verifique o tempo de resposta do servi\u00e7o upstream, a configura\u00e7\u00e3o de tempo limite downstream e se o endpoint upstream precisa ser otimizado
error.upstream.timeout.retry=Sim
error.system.internal.meaning=Erro interno do sistema
error.system.internal.cause=Uma exce\u00e7\u00e3o n\u00e3o capturada e n\u00e3o classificada no gateway (ponteiro nulo, recurso indispon\u00edvel etc.); a classe de exce\u00e7\u00e3o espec\u00edfica foi mapeada para este c\u00f3digo
error.system.internal.investigate=Verifique o ID do erro nos registros do gateway e entre em contato com a opera\u00e7\u00e3o para inspecionar o status dos servi\u00e7os downstream
error.system.internal.retry=N\u00e3o
error.route.not.found.meaning=Rota n\u00e3o encontrada
error.route.not.found.cause=O Spring Cloud Gateway n\u00e3o associou nenhuma rota downstream
error.route.not.found.investigate=Verifique se o caminho da requisi\u00e7\u00e3o est\u00e1 correto, se a tabela de rotas cont\u00e9m esta URL e se as regras de correspond\u00eancia de caminho est\u00e3o em vigor
error.route.not.found.retry=N\u00e3o
error.req.bad.request.meaning=Par\u00e2metros de requisi\u00e7\u00e3o inv\u00e1lidos
error.req.bad.request.cause=A desserializa\u00e7\u00e3o do corpo da requisi\u00e7\u00e3o falhou, a valida\u00e7\u00e3o dos campos n\u00e3o passou ou os par\u00e2metros da requisi\u00e7\u00e3o est\u00e3o fora do intervalo permitido
error.req.bad.request.investigate=Verifique o formato JSON do corpo da requisi\u00e7\u00e3o, confirme os nomes e tipos dos campos e consulte as restri\u00e7\u00f5es de par\u00e2metros na documenta\u00e7\u00e3o da API
error.req.bad.request.retry=N\u00e3o
